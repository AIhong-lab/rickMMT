<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMT 天賦原理 · 自動生成天賦盤</title>
  <meta name="description" content="輸入生日，自動生成 MMT 天賦原理個人分析：六張天賦牌、導師／陰影、四大能量與年度策略。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <div>
        <h1>MMT 天賦原理</h1>
        <p>Mercury Mental Thinking · 自動生成天賦盤</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="input-panel">
      <h2>輸入你的天賦盤</h2>
      <p class="input-sub">直接填入你已排好的天賦盤數字，系統只負責生成完整的敘述解讀，<b>不進行計算</b>。</p>
      <label class="field field-q">
        <span>稱呼／姓名（可留空）</span>
        <input id="in-name" type="text" autocomplete="off" placeholder="例如：小明／客戶 A">
      </label>
      <div class="form-grid form-grid-2">
        <label class="field field-t">
          <span>內在天賦（自身思維 · 三張）</span>
          <input id="in-inner" type="text" autocomplete="off" placeholder="例如：5, 6, 6">
        </label>
        <label class="field field-t">
          <span>外在天賦（與世界相處 · 三張）</span>
          <input id="in-outer" type="text" autocomplete="off" placeholder="例如：6, 7, 11">
        </label>
      </div>
      <div class="form-grid form-grid-3">
        <label class="field field-t">
          <span>導師（可多張）</span>
          <input id="in-master" type="text" autocomplete="off" placeholder="例如：1, 10">
        </label>
        <label class="field field-t">
          <span>陰影（可多張）</span>
          <input id="in-shadow" type="text" autocomplete="off" placeholder="例如：12, 21">
        </label>
        <label class="field field-t">
          <span>年度策略號碼（5–16）</span>
          <input id="in-year-strategy" type="text" autocomplete="off" placeholder="例如：10">
        </label>
      </div>
      <div class="energy-input">
        <span class="energy-input-label">四大能量比例（%）</span>
        <div class="energy-input-grid">
          <label><span>🍃 風</span><input id="in-e-wind" type="number" min="0" max="100" placeholder="0"></label>
          <label><span>🔥 火</span><input id="in-e-fire" type="number" min="0" max="100" placeholder="0"></label>
          <label><span>💧 水</span><input id="in-e-water" type="number" min="0" max="100" placeholder="0"></label>
          <label><span>⛰️ 土</span><input id="in-e-earth" type="number" min="0" max="100" placeholder="0"></label>
        </div>
      </div>
      <label class="field field-q">
        <span>年份標籤（可留空 · 顯示在年度策略）</span>
        <input id="in-year-label" type="text" autocomplete="off" placeholder="例如：2026">
      </label>
      <div class="level-row">
        <span>顯示詳細度：</span>
        <label><input type="radio" name="level" value="concise" checked> 精簡</label>
        <label><input type="radio" name="level" value="full"> 完整</label>
      </div>
      <button id="btn-generate" class="btn-generate">✦ 生成天賦盤解讀</button>
    </section>

    <div id="report" class="report"></div>

    <footer class="site-footer">
      <p>本工具依個人上課整理（MMT1階-直版天賦原理）製作，僅供自我覺察與個人使用。</p>
      <p class="ip">天賦原理課程原始內容之智慧財產權屬「水盈盈企業管理顧問有限公司」。</p>
    </footer>
  </main>

  <script src="js/data.js"></script>
  <script src="js/talents.js"></script>
  <script src="js/v15.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
